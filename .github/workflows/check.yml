name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PRs are squash-merged with the title as the commit message, and release-please reads those to
      # pick the next version and write the changelog.
      - name: PR title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9./-]+\))?!?: .+'; then
            echo "::error::Start the PR title with a conventional commit type, e.g. \"feat: show blame for unchanged lines\" or \"fix(diff): ...\". It becomes the commit message, and release-please reads it."
            exit 1
          fi
      # dist/ is built by the build workflow after a merge; a PR that edits it would only conflict.
      - name: PRs leave dist/ alone
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^dist/'; then
            echo "::error::This PR changes dist/. Leave it out: it's rebuilt from src/ automatically after merging."
            exit 1
          fi
      # Types, then a fresh build of src/ and the end-to-end smoke test against it (the page check runs in Chrome).
      - run: npm run check
        env:
          CHROME: /usr/bin/google-chrome
