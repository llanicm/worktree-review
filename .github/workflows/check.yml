name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Types, dist/ matching src/, and the end-to-end smoke test (the page check runs where Chrome is installed).
      - run: npm run check
        env:
          CHROME: /usr/bin/google-chrome
