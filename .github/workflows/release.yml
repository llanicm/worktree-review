name: release
# Push a tag matching the plugin's version (e.g. v2.0.5) to publish a GitHub Release with notes.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches the plugin version
        run: |
          want="v$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::Tag $GITHUB_REF_NAME doesn't match plugin.json ($want)."; exit 1; fi
      # What users install is the committed dist/, so it has to match src/ at the tagged commit.
      - name: dist/ matches src/
        run: node build.mjs --check
      - run: npm run check
        env:
          CHROME: /usr/bin/google-chrome
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
